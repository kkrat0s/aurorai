name: Verify AuroraSense
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: science/requirements.txt
      - run: python -m pip install -r science/requirements.txt
      - run: python -m unittest discover -s science/tests -v
      - name: Reproduce frozen retrospective scores without downloading data
        run: python -m science.experiments.learn --offline
  mobile-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npm run typecheck --prefix apps/mobile
      - name: Bundle Android JavaScript; this does not test physical sensors
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-android
      - name: Bundle iOS JavaScript; this does not test physical sensors
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir dist-ios
